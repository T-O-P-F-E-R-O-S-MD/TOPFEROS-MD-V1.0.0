<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TOPFEROS MD V2.0.0 — Settings</title>

  <meta
    name="description"
    content="TOPFEROS MD V2.0.0 Settings Panel"
  >

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <main class="panel-page">

    <div
      class="panel-background"
      aria-hidden="true"
    ></div>

    <section class="panel-card">

      <!-- LOGO -->
      <div class="panel-logo-wrapper">
        <img
          id="panelLogo"
          class="panel-logo"
          src="/assets/logo.png"
          alt="TOPFEROS MD"
          onerror="this.style.display='none'"
        >
      </div>

      <!-- HEADER -->
      <header class="panel-header">

        <h1>
          🦁 TOPFEROS MD PANEL SETTINGS 🐑
        </h1>

        <p class="panel-version">
          V2.0.0
        </p>

        <div
          id="connectionStatus"
          class="connection-status disconnected"
          data-connection-status
        >
          🔴 DISCONNECTED
        </div>

      </header>

      <!-- LANGUAGE -->
      <section class="panel-section">

        <div class="section-title">
          🌐 LANGUAGE
        </div>

        <div class="field-group">

          <label for="panelLanguage">
            PANEL LANGUAGE
          </label>

          <select
            id="panelLanguage"
            data-language-select
          >
            <option value="en">🇺🇸 English</option>
            <option value="fr">🇫🇷 Français</option>
            <option value="es">🇪🇸 Español</option>
            <option value="es_do">🇩🇴 Español Dominicano</option>
            <option value="pt">🇵🇹 Português</option>
            <option value="zh">🇨🇳 中文</option>
            <option value="ht">🇭🇹 Kreyòl Ayisyen</option>
          </select>

        </div>

      </section>

      <!-- SESSION VERIFICATION -->
      <section class="panel-section">

        <div class="section-title">
          🔐 SESSION VERIFICATION
        </div>

        <div class="field-group">

          <label for="ownerNumber">
            NUMBER
          </label>

          <input
            id="ownerNumber"
            type="text"
            inputmode="tel"
            autocomplete="off"
            placeholder="WhatsApp number"
          >

        </div>

        <div class="field-group">

          <label for="verificationCode">
            CODE
          </label>

          <input
            id="verificationCode"
            type="text"
            autocomplete="off"
            placeholder="Verification code"
          >

        </div>

        <button
          type="button"
          class="panel-button primary"
          id="verifyButton"
        >
          🔐 VERIFY
        </button>

      </section>

      <div id="settingsContent" hidden>

      <!-- INFO BASIC -->
      <section class="panel-section">

        <div class="section-title">
          ⚡ INFO BASIC
        </div>

        <div class="field-group">
          <label for="botName">BOT NAME</label>
          <input
            id="botName"
            type="text"
            value="TOPFEROS MD"
            autocomplete="off"
          >
        </div>

        <div class="field-group">
          <label for="location">LOCATION</label>
          <input
            id="location"
            type="text"
            value="HAÏTI"
            autocomplete="off"
          >
        </div>

        <div class="field-group">
          <label for="age">AGE</label>
          <input
            id="age"
            type="number"
            min="1"
            value="14"
          >
        </div>

        <div class="field-group">
          <label for="prefix">PREFIX</label>
          <input
            id="prefix"
            type="text"
            value="."
            maxlength="5"
          >
        </div>

        <div class="field-group">
          <label for="footer">FOOTER</label>
          <input
            id="footer"
            type="text"
            value="🦁 TECH BY TOPFEROS MD 🐑"
            autocomplete="off"
          >
        </div>

        <div class="field-group">
          <label for="mode">MODE</label>
          <select id="mode">
            <option value="Public">Public</option>
            <option value="Private">Private</option>
            <option value="Group">Group</option>
          </select>
        </div>

      </section>
