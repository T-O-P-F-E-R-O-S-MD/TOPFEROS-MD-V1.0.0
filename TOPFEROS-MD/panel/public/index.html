<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TOPFEROS MD</title>

  <link
    rel="stylesheet"
    href="/style.css"
  >
</head>

<body>

  <!-- ==================================================
       🦁 TOPFEROS MD
       Paj prensipal Panel la

       Flow:
       1. Chwazi lang
       2. Login ak Number + Parrain Code
       3. Ale nan Settings Panel
       ================================================== -->

  <main class="container">

    <!-- ==================================================
         🌍 ETAP 1 — CHWAZI LANG
         ================================================== -->

    <section
      id="languageScreen"
      class="card"
    >

      <img
        src="/logo.png"
        alt="TOPFEROS MD"
        class="logo"
        onerror="this.style.display='none'"
      >

      <h1>TOPFEROS MD</h1>

      <p class="subtitle">
        • Principal Language
      </p>

      <p>
        Choose your principal language.
      </p>

      <select
        id="language"
        class="input"
      >

        <option value="en">
          English
        </option>

        <option value="fr">
          Français
        </option>

        <option value="es">
          Español
        </option>

      </select>

      <button
        id="languageNext"
        class="button"
        type="button"
      >
        NEXT
      </button>

    </section>


    <!-- ==================================================
         🔐 ETAP 2 — LOGIN
         Number + Parrain Code
         ================================================== -->

    <section
      id="loginScreen"
      class="card"
      style="display:none;"
    >

      <img
        src="/logo.png"
        alt="TOPFEROS MD"
        class="logo"
        onerror="this.style.display='none'"
      >

      <h1>
        TOPFEROS MD
      </h1>

      <p class="subtitle">
        ⚙️ Settings Panel
      </p>


      <!-- Nimewo bot la -->

      <label for="number">
        Number :
      </label>

      <input
        id="number"
        name="number"
        class="input"
        type="tel"
        inputmode="numeric"
        autocomplete="off"
        placeholder="Enter bot number"
      >


      <!-- Code Parrain lan -->

      <label for="code">
        Code :
      </label>

      <input
        id="code"
        name="code"
        class="input"
        type="text"
        autocomplete="off"
        placeholder="Enter Parrain Code"
      >


      <!-- Mesaj erè / enfòmasyon -->

      <div
        id="message"
        class="message"
      ></div>


      <!-- Bouton NEXT -->

      <button
        id="nextButton"
        class="button"
        type="button"
      >
        NEXT
      </button>


      <div class="footer">
        Made in TOPFEROS TECH
        <br>
        ========================
      </div>

    </section>

  </main>


  <!-- ==================================================
       📜 SCRIPT
       app.js ap jere:

       • Lang
       • Session ID
       • Login
       • Parrain Code
       • Redireksyon Settings Panel
       ================================================== -->

  <script src="/app.js"></script>

</body>

</html>
