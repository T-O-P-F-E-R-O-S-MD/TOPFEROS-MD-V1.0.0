<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>TOPFEROS MD SETTINGS</title>

  <link
    rel="stylesheet"
    href="/style.css?v=20"
  >
</head>

<body>

  <main class="container">

    <img
      src="/assets/logo.png"
      class="logo"
      alt="TOPFEROS MD"
    >

    <h1>🦁 TOPFEROS MD SETTINGS</h1>

    <!-- LANGUAGE -->

    <section id="languageScreen" class="screen">

      <h2>🌐 Select Language</h2>

      <button onclick="selectLanguage('en')">
        🇬🇧 English
      </button>

      <button onclick="selectLanguage('fr')">
        🇫🇷 Français
      </button>

      <button onclick="selectLanguage('es')">
        🇪🇸 Español
      </button>

    </section>


    <!-- SETTINGS LOGIN -->

    <section
      id="loginScreen"
      class="screen hidden"
    >

      <h2>🔐 Settings Login</h2>

      <p class="description">
        Enter your 6-character Settings Code.
      </p>

      <input
        id="settingsCode"
        type="text"
        maxlength="6"
        autocomplete="off"
        placeholder="G7K2P9"
      >

      <button
        id="verifyButton"
        onclick="verifySettings()"
      >
        🔓 VERIFY / CONNECT
      </button>

      <p
        id="loginMessage"
        class="message"
      ></p>

    </section>


    <!-- DASHBOARD -->

    <section
      id="dashboard"
      class="hidden"
    >

      <div class="dashboardHeader">

        <img
          src="/assets/logo.png"
          class="dashboardLogo"
          alt="TOPFEROS MD"
        >

        <h2>⚙️ BOT SETTINGS</h2>

        <p id="connectionState">
          🟢 Connected
        </p>

      </div>


      <!-- BOT INFORMATION -->

      <div class="card">

        <h3>🤖 BOT INFORMATION</h3>

        <div class="infoGrid">

          <label>
            Name
            <input
              id="botName"
              type="text"
              value="TOPFEROS MD"
            >
          </label>

          <label>
            Number
            <input
              id="botNumber"
              type="text"
              readonly
            >
          </label>

          <label>
            Prefix
            <input
              id="botPrefix"
              type="text"
              value="."
              maxlength="5"
            >
          </label>

          <label>
            Mode
            <input
              id="botMode"
              type="text"
              readonly
            >
          </label>

        </div>

      </div>


      <!-- GENERAL -->

      <div class="card">

        <h3>⚙️ GENERAL</h3>

        <div id="generalSettings"></div>

      </div>


      <!-- PROTECTION -->

      <div class="card">

        <h3>🛡️ PROTECTION</h3>

        <div id="protectionSettings"></div>

      </div>


      <!-- STATUS -->

      <div class="card">

        <h3>📱 STATUS</h3>

        <div id="statusSettings"></div>

      </div>


      <!-- GROUP -->

      <div class="card">

        <h3>👥 GROUP</h3>

        <div id="groupSettings"></div>

      </div>


      <!-- AI -->

      <div class="card">

        <h3>🤖 AI</h3>

        <div id="aiSettings"></div>

      </div>


      <!-- SAVE -->

      <button
        id="saveButton"
        class="saveButton"
        onclick="saveSettings()"
      >
        💾 APP SOVE
      </button>

      <p
        id="saveMessage"
        class="message"
      ></p>


      <footer>
        ==========================<br>
        By TOPFEROS Tech<br>
        ==========================
      </footer>

    </section>

  </main>

  <script src="/app.js?v=20"></script>

</body>
</html>
