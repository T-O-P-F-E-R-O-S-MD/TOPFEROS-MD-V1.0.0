<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="description"
    content="TOPFEROS MD V1.0.0"
  >

  <title>TOPFEROS MD</title>

  <link rel="stylesheet" href="/style.css?v=6">
</head>

<body>

  <main class="container">

    <!-- LOGO -->
    <div class="logo-container">
      <img
        src="/assets/logo.png"
        alt="TOPFEROS MD"
        class="logo"
      >
    </div>


    <!-- LANGUAGE SCREEN -->
    <section
      id="languageScreen"
      class="screen active"
    >

      <h1 id="languageTitle">
        Language
      </h1>

      <div class="language-buttons">

        <button
          type="button"
          class="language-button"
          data-language="en"
        >
          Anglais
        </button>

        <button
          type="button"
          class="language-button"
          data-language="fr"
        >
          Français
        </button>

        <button
          type="button"
          class="language-button"
          data-language="es"
        >
          Espagnol
        </button>

      </div>

    </section>


    <!-- PARRAIN SCREEN -->
    <section
      id="parrainScreen"
      class="screen"
      hidden
    >

      <h1 id="parrainTitle">
        Parrain Number
      </h1>


      <!-- PARRAIN NUMBER -->
      <div class="parrain-number-container">

        <strong
          id="parrainNumber"
          class="parrain-number"
        >
          ---
        </strong>

      </div>


      <!-- GENERATE PARRAIN CODE -->
      <button
        type="button"
        id="generateParrainButton"
        class="primary-button"
      >
        Généré Parrain Code
      </button>


      <!-- MESSAGE -->
      <p
        id="parrainMessage"
        class="message"
        aria-live="polite"
      ></p>


      <!-- PARRAIN CODE -->
      <div
        id="parrainCodeSection"
        class="parrain-code-section"
        hidden
      >

        <div class="parrain-code-label">
          <span id="parrainCodeTitle">
            Parrain Code
          </span>
        </div>


        <div class="code-container">

          <input
            type="text"
            id="parrainCode"
            readonly
            aria-label="Parrain Code"
          >

          <button
            type="button"
            id="copyParrainButton"
            class="secondary-button"
          >
            Copier
          </button>

        </div>

      </div>

    </section>

  </main>


  <!-- FOOTER -->
  <footer class="footer">

    <div class="footer-line">
      ==========================
    </div>

    <div id="footerText">
      By TOPFEROS TECH
    </div>

    <div class="footer-line">
      ==========================
    </div>

  </footer>


  <script
    src="/app.js?v=6"
    defer
  ></script>

</body>
</html>
