<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="TOPFEROS MD V1.0.0"
  >

  <title>TOPFEROS MD</title>

  <link
    rel="stylesheet"
    href="/style.css?v=10"
  >
</head>

<body>

  <main class="container">

    <!-- =========================
         LOGO
    ========================== -->

    <div class="logo-container">

      <img
        src="/assets/logo.png"
        alt="TOPFEROS MD"
        class="logo"
      >

    </div>


    <!-- =========================
         LANGUAGE SCREEN
    ========================== -->

    <section
      id="languageScreen"
      class="screen active"
    >

      <h1 id="languageTitle">
        Language
      </h1>

      <div class="language-buttons">

        <button
          type="button"
          class="language-button"
          data-language="en"
        >
          English
        </button>

        <button
          type="button"
          class="language-button"
          data-language="fr"
        >
          Français
        </button>

        <button
          type="button"
          class="language-button"
          data-language="es"
        >
          Español
        </button>

      </div>

    </section>


    <!-- =========================
         PARRAIN SCREEN
    ========================== -->

    <section
      id="parrainScreen"
      class="screen"
      hidden
    >

      <h1 id="parrainTitle">
        Parrain Number
      </h1>


      <!-- =========================
           WHATSAPP NUMBER
      ========================== -->

      <div class="input-group">

        <label
          id="numberLabel"
          for="parrainNumberInput"
        >
          WhatsApp Number
        </label>

        <input
          type="tel"
          id="parrainNumberInput"
          class="number-input"
          inputmode="numeric"
          autocomplete="tel"
          placeholder="509XXXXXXXX"
        >

        <small id="numberHint">
          Pa mete +, espas oswa -
        </small>

      </div>


      <!-- =========================
           GENERATE BUTTON
      ========================== -->

      <button
        type="button"
        id="generateParrainButton"
        class="primary-button"
      >
        Générer Parrain Code
      </button>


      <!-- =========================
           MESSAGE
      ========================== -->

      <p
        id="parrainMessage"
        class="message"
        aria-live="polite"
      ></p>


      <!-- =========================
           PARRAIN CODE
      ========================== -->

      <div
        id="parrainCodeSection"
        class="parrain-code-section"
        hidden
      >

        <h2 id="parrainCodeTitle">
          Parrain Code
        </h2>

        <div class="code-container">

          <input
            type="text"
            id="parrainCode"
            readonly
            aria-label="Parrain Code"
          >

          <button
            type="button"
            id="copyParrainButton"
            class="secondary-button"
          >
            Copier
          </button>

        </div>

      </div>

    </section>

  </main>


  <!-- =========================
       FOOTER
  ========================== -->

  <footer class="footer">

    <div class="footer-line">
      ==========================
    </div>

    <div id="footerText">
      By TOPFEROS TECH
    </div>

    <div class="footer-line">
      ==========================
    </div>

  </footer>


  <!-- =========================
       JAVASCRIPT
  ========================== -->

  <script
    src="/app.js?v=10"
    defer
  ></script>

</body>
</html>
