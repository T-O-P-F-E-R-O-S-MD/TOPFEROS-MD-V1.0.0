<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>TOPFEROS MD — Panel</title>

    <link
        rel="stylesheet"
        href="/style.css?v=3"
    >
</head>

<body>

    <main class="panel-container">

        <!-- ═══════════════════════════════════════ -->
        <!-- LOGO                                    -->
        <!-- ═══════════════════════════════════════ -->

        <div class="logo-container">
            <img
                src="/assets/logo.png"
                alt="TOPFEROS MD"
                class="bot-logo"
            >
        </div>


        <!-- ═══════════════════════════════════════ -->
        <!-- BOT NAME                                -->
        <!-- ═══════════════════════════════════════ -->

        <h1 class="bot-name">
            TOPFEROS MD
        </h1>

        <p class="bot-version">
            V1.0.0
        </p>


        <!-- ═══════════════════════════════════════ -->
        <!-- STEP 1 — LANGUAGE                       -->
        <!-- ═══════════════════════════════════════ -->

        <section
            id="languageScreen"
            class="screen active"
        >

            <h2>
                Select Language
            </h2>

            <p class="subtitle">
                Choose your preferred language
            </p>


            <div class="language-buttons">

                <button
                    type="button"
                    class="language-button"
                    data-language="en"
                >
                    🇺🇸 English
                </button>


                <button
                    type="button"
                    class="language-button"
                    data-language="fr"
                >
                    🇫🇷 Français
                </button>


                <button
                    type="button"
                    class="language-button"
                    data-language="es"
                >
                    🇪🇸 Español
                </button>

            </div>

        </section>


        <!-- ═══════════════════════════════════════ -->
        <!-- STEP 2 — PANEL CODE                    -->
        <!-- ═══════════════════════════════════════ -->

        <section
            id="panelCodeScreen"
            class="screen"
        >

            <h2 id="panelCodeTitle">
                Panel Code
            </h2>

            <p
                id="panelCodeSubtitle"
                class="subtitle"
            >
                Enter your number and Panel Code
            </p>


            <form
                id="panelCodeForm"
                autocomplete="off"
            >

                <!-- NUMBER USER -->

                <div class="form-group">

                    <label
                        for="number"
                        id="numberLabel"
                    >
                        Number User
                    </label>

                    <input
                        type="tel"
                        id="number"
                        name="number"
                        placeholder="509XXXXXXXX"
                        autocomplete="tel"
                        inputmode="tel"
                        required
                    >

                </div>


                <!-- PANEL CODE -->

                <div class="form-group">

                    <label
                        for="panelCode"
                        id="panelCodeLabel"
                    >
                        Panel Code
                    </label>

                    <input
                        type="text"
                        id="panelCode"
                        name="panelCode"
                        placeholder="Enter Panel Code"
                        autocomplete="off"
                        autocapitalize="characters"
                        spellcheck="false"
                        required
                    >

                </div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    id="panelLoginButton"
                    class="primary-button"
                >
                    LOGIN
                </button>

            </form>


            <p
                id="panelMessage"
                class="message"
                aria-live="polite"
            ></p>

        </section>


        <!-- ═══════════════════════════════════════ -->
        <!-- STEP 3 — PARRAIN CODE                  -->
        <!-- ═══════════════════════════════════════ -->

        <section
            id="parrainCodeScreen"
            class="screen"
        >

            <h2 id="parrainTitle">
                Parrain Code
            </h2>

            <p
                id="parrainSubtitle"
                class="subtitle"
            >
                Generate your Parrain Code
            </p>


            <!-- PARRAIN NUMBER -->

            <div class="parrain-number-box">

                <span
                    id="parrainNumberLabel"
                    class="info-label"
                >
                    Parrain numéro
                </span>

                <strong
                    id="parrainNumber"
                    class="parrain-number"
                >
                    ---
                </strong>

            </div>


            <!-- GENERATE BUTTON -->

            <button
                type="button"
                id="generateParrainButton"
                class="primary-button"
            >
                GENERER PARRAIN CODE
            </button>


            <!-- CODE RESULT -->

            <div
                id="parrainCodeSection"
                class="parrain-code-section"
                hidden
            >

                <span
                    id="parrainCodeLabel"
                    class="info-label"
                >
                    PARRAIN CODE
                </span>


                <div class="code-display">

                    <span
                        id="parrainCode"
                        class="generated-code"
                    >
                        ------
                    </span>

                </div>


                <!-- COPY -->

                <button
                    type="button"
                    id="copyParrainButton"
                    class="secondary-button"
                >
                    📋 COPY
                </button>


                <p
                    id="parrainExpiry"
                    class="expiry-text"
                    aria-live="polite"
                ></p>

            </div>


            <!-- NEXT -->

            <button
                type="button"
                id="nextButton"
                class="next-button"
                hidden
            >
                NEXT →
            </button>


            <p
                id="parrainMessage"
                class="message"
                aria-live="polite"
            ></p>

        </section>


        <!-- ═══════════════════════════════════════ -->
        <!-- FOOTER                                  -->
        <!-- ═══════════════════════════════════════ -->

        <footer class="panel-footer">

            <span>
                By
            </span>

            <strong>
                TOPFEROS TECH
            </strong>

        </footer>

    </main>


    <!-- ═══════════════════════════════════════ -->
    <!-- JAVASCRIPT                             -->
    <!-- ═══════════════════════════════════════ -->

    <script src="/app.js?v=3"></script>

</body>
</html>
