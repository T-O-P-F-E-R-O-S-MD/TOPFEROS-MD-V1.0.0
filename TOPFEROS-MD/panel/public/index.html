<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#000000"
    >

    <title>TOPFEROS MD V1.0.0</title>

    <link
        rel="stylesheet"
        href="/style.css?v=4"
    >
</head>

<body>

    <!-- =====================================================
         MAIN CONTAINER
         ===================================================== -->

    <main class="container">

        <!-- =================================================
             LOGO
             ================================================= -->

        <div class="logo-container">
            <img
                src="/assets/logo.png"
                alt="TOPFEROS MD"
                class="logo"
            >
        </div>


        <!-- =================================================
             LANGUAGE SCREEN
             ================================================= -->

        <section
            id="languageScreen"
            class="screen language-screen"
        >

            <h1>
                TOPFEROS MD
            </h1>

            <p class="subtitle">
                Select your language
            </p>

            <div class="language-buttons">

                <button
                    type="button"
                    class="language-button"
                    data-language="en"
                >
                    🇺🇸 English
                </button>

                <button
                    type="button"
                    class="language-button"
                    data-language="fr"
                >
                    🇫🇷 Français
                </button>

                <button
                    type="button"
                    class="language-button"
                    data-language="es"
                >
                    🇪🇸 Español
                </button>

            </div>

        </section>


        <!-- =================================================
             PANEL CODE SCREEN
             ================================================= -->

        <section
            id="panelCodeScreen"
            class="screen"
            style="display: none;"
        >

            <h2 id="panelCodeTitle">
                CODE PANEL
            </h2>

            <form
                id="panelCodeForm"
                autocomplete="off"
            >

                <!-- NUMBER -->

                <div class="input-group">

                    <label
                        for="number"
                    >
                        Numéro
                    </label>

                    <input
                        type="tel"
                        id="number"
                        name="number"
                        placeholder="509XXXXXXXX"
                        inputmode="numeric"
                        autocomplete="tel"
                        required
                    >

                </div>


                <!-- PANEL CODE -->

                <div class="input-group">

                    <label
                        for="panelCode"
                    >
                        Code
                    </label>

                    <input
                        type="text"
                        id="panelCode"
                        name="panelCode"
                        placeholder="Code Panel"
                        autocomplete="off"
                        required
                    >

                </div>


                <!-- MESSAGE -->

                <div
                    id="panelMessage"
                    class="message"
                    aria-live="polite"
                ></div>


                <!-- LOGIN -->

                <button
                    type="submit"
                    id="panelLoginButton"
                    class="primary-button"
                >
                    CONNEXION
                </button>

            </form>

        </section>


        <!-- =================================================
             PARRAIN CODE SCREEN
             ================================================= -->

        <section
            id="parrainCodeScreen"
            class="screen"
            style="display: none;"
        >

            <h2 id="parrainCodeTitle">
                CODE PARRAIN
            </h2>


            <!-- =============================================
                 PARRAIN NUMBER
                 ============================================= -->

            <div class="parrain-number-container">

                <div class="separator">
                    ____________________________
                </div>

                <p class="parrain-number-label">
                    𝐏𝐚𝐫𝐫𝐚𝐢𝐧 𝐧𝐮𝐦𝐛𝐞𝐫 :
                </p>

                <strong
                    id="parrainNumber"
                    class="parrain-number"
                >
                    ---
                </strong>

                <div class="separator">
                    ____________________________
                </div>

            </div>


            <!-- =============================================
                 GENERATE BUTTON
                 ============================================= -->

            <button
                type="button"
                id="generateParrainButton"
                class="primary-button"
            >
                GÉNÉRER CODE PARRAIN
            </button>


            <!-- =============================================
                 MESSAGE
                 ============================================= -->

            <div
                id="parrainMessage"
                class="message"
                aria-live="polite"
            ></div>


            <!-- =============================================
                 PARRAIN CODE
                 ============================================= -->

            <div
                id="parrainCodeSection"
                class="parrain-code-section"
                style="display: none;"
            >

                <div class="separator">
                    ____________________________
                </div>

                <p class="parrain-code-label">
                    𝐏𝐚𝐫𝐫𝐚𝐢𝐧 𝐜𝐨𝐝𝐞 :
                </p>

                <strong
                    id="parrainCode"
                    class="parrain-code"
                ></strong>

                <div class="separator">
                    ____________________________
                </div>


                <!-- COPY -->

                <button
                    type="button"
                    id="copyParrainButton"
                    class="secondary-button"
                >
                    COPIER
                </button>

            </div>

        </section>

    </main>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="/app.js?v=4"
        defer
    ></script>

</body>
</html>
